name: Rebuild site from sheet

on:
  schedule:
    - cron: '31 2 * * *'   # every evening, about 6:30pm Seattle time
  workflow_dispatch:        # adds a "Run workflow" button

permissions:
  contents: write

concurrency: rebuild

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the Google Sheet
        env:
          SHEET_URL: ${{ secrets.SHEET_URL }}
        run: |
          curl -fsSL "$SHEET_URL" -o "$RUNNER_TEMP/sheet.json"
          python3 - "$RUNNER_TEMP" <<'EOF'
          import json, sys
          d = json.load(open(sys.argv[1] + '/sheet.json'))
          if 'events' not in d:
              sys.exit('Could not read the sheet: ' + str(d)[:200])
          json.dump(d['events'], open(sys.argv[1] + '/events.json', 'w'))
          json.dump(d['bars'], open(sys.argv[1] + '/bars.json', 'w'))
          # Give Back, Holiday Drives and Meal Kitchens, once the Apps Script sends them
          tabs = {k: d[k] for k in ('give', 'drives', 'meals') if k in d}
          json.dump(tabs, open(sys.argv[1] + '/tabs.json', 'w'))
          EOF

      - name: Build the site
        run: sh build/run.sh "$RUNNER_TEMP/events.json" "$RUNNER_TEMP/bars.json" "$RUNNER_TEMP/tabs.json"

      - name: Publish if anything changed
        run: |
          git config user.name merrylittleseattle
          git config user.email merrylittleseattle@users.noreply.github.com
          git add index.html build/give.json build/drives.json build/meals.json build/hmeals.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Rebuild from sheet $(date -u +%F)"
          git push
